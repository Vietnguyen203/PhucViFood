# Postgres dùng chung một container cho môi trường dev; mỗi service một database riêng.
# Chạy: docker compose -f BE/infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: phucvi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - phucvi-pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Message broker cho sự kiện giữa các service (transactional outbox đẩy vào đây).
  # Giao diện quản trị: http://localhost:15672
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: phucvi-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-phucvi}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-phucvi}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - phucvi-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  phucvi-pgdata:
  phucvi-rabbitmq:
